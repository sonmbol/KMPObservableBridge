<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">KMPObservableBridge runtime architecture</title>
  <desc id="desc">Kotlin StateFlow values cross a shared observation hub into field-level SwiftUI dependencies without duplicating state.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d22"/>
      <stop offset="1" stop-color="#101c3c"/>
    </linearGradient>
    <linearGradient id="kotlin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="swift" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">One source of truth. Native SwiftUI dependencies.</text>

    <g transform="translate(45 102)">
      <rect width="285" height="242" rx="22" fill="#151a38" stroke="#7c3aed" stroke-width="2"/>
      <rect x="22" y="22" width="52" height="52" rx="14" fill="url(#kotlin)"/>
      <text x="92" y="55" fill="#f8fafc" font-size="22" font-weight="700">Kotlin ViewModel</text>
      <text x="22" y="103" fill="#c4b5fd" font-size="16">StateFlow&lt;ProfileState&gt;</text>
      <text x="22" y="137" fill="#c4b5fd" font-size="16">StateFlow&lt;Permissions&gt;</text>
      <text x="22" y="171" fill="#c4b5fd" font-size="16">Kotlin actions</text>
      <line x1="22" y1="194" x2="263" y2="194" stroke="#373c63"/>
      <text x="22" y="220" fill="#94a3b8" font-size="14">Authoritative current values</text>
    </g>

    <g transform="translate(457 82)">
      <rect width="286" height="282" rx="22" fill="#101d3d" stroke="#3b82f6" stroke-width="2"/>
      <text x="143" y="43" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Observation Bridge</text>
      <rect x="23" y="69" width="240" height="42" rx="12" fill="#172554"/>
      <text x="143" y="95" text-anchor="middle" fill="#bfdbfe" font-size="15">Shared collector hub</text>
      <rect x="23" y="126" width="240" height="42" rx="12" fill="#172554"/>
      <text x="143" y="152" text-anchor="middle" fill="#bfdbfe" font-size="15">Equality + coalescing</text>
      <rect x="23" y="183" width="240" height="42" rx="12" fill="#172554"/>
      <text x="143" y="209" text-anchor="middle" fill="#bfdbfe" font-size="15">Field dependency keys</text>
      <text x="143" y="255" text-anchor="middle" fill="#94a3b8" font-size="14">No copied business state</text>
    </g>

    <g transform="translate(870 102)">
      <rect width="285" height="242" rx="22" fill="#101d38" stroke="#0ea5e9" stroke-width="2"/>
      <rect x="22" y="22" width="52" height="52" rx="14" fill="url(#swift)"/>
      <text x="92" y="55" fill="#f8fafc" font-size="22" font-weight="700">SwiftUI View Graph</text>
      <rect x="22" y="96" width="241" height="36" rx="10" fill="#0c4a6e"/>
      <text x="142" y="119" text-anchor="middle" fill="#e0f2fe" font-size="14">$profile.profileState</text>
      <rect x="22" y="145" width="241" height="36" rx="10" fill="#0c4a6e"/>
      <text x="142" y="168" text-anchor="middle" fill="#e0f2fe" font-size="14">$profile.permissionsState</text>
      <text x="22" y="216" fill="#94a3b8" font-size="14">Only accessed fields invalidate</text>
    </g>

    <path d="M 335 223 C 375 223, 410 223, 450 223" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#arrow)" filter="url(#glow)"/>
    <path d="M 750 223 C 790 223, 825 223, 863 223" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)" filter="url(#glow)"/>
    <text x="394" y="202" text-anchor="middle" fill="#c4b5fd" font-size="13">SKIE AsyncSequence</text>
    <text x="808" y="202" text-anchor="middle" fill="#bae6fd" font-size="13">Observation</text>

    <text x="600" y="409" text-anchor="middle" fill="#94a3b8" font-size="15">One collection per model · deterministic cancellation · iOS 15+ fallback</text>
  </g>
</svg>
